[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ordinatics"
version = "0.2.0"
description = "Exact ordinal arithmetic, ordinal calculus, dynamics, symbolic specialization, and bounded typed satisfaction"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tyler Roost"}]
keywords = ["ordinal", "arithmetic", "ordinal-calculus", "veblen-hierarchy", "ordinal-dynamics", "sympy", "symbolic-mathematics", "logic", "satisfaction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
symbolic = ["sympy>=1.13.3,<2"]
scientific = ["sympy>=1.13.3,<2", "numpy>=1.26", "scipy>=1.11"]
test = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "sympy>=1.13.3,<2",
  "numpy>=1.26",
  "scipy>=1.11",
]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "ruff>=0.11",
  "build>=1.2",
  "twine>=6.0",
  "hatchling>=1.27",
  "sympy>=1.13.3,<2",
  "numpy>=1.26",
  "scipy>=1.11",
]
release = [
  "build>=1.2",
  "twine>=6.0",
  "hatchling>=1.27",
]

[project.urls]
Homepage = "https://github.com/TimeLordRaps/ordinatics"
Documentation = "https://github.com/TimeLordRaps/ordinatics/tree/main/docs"
Repository = "https://github.com/TimeLordRaps/ordinatics"
Issues = "https://github.com/TimeLordRaps/ordinatics/issues"
Paper = "https://github.com/TimeLordRaps/ordinatics/blob/main/paper/ordinal_arithmetic.pdf"

[tool.hatch.build.targets.wheel]
packages = ["src/ordinatics"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "paper/ordinal_arithmetic.tex", "paper/ordinal_arithmetic.md", "scripts/build_paper.py", "CITATION.cff", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["artifacts_tmp", "build", "dist", ".git", ".venv", "_site"]
addopts = "-vv -s --durations=10 --timeout=60"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
