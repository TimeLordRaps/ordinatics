name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ordinatics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  software:
    name: software (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            sympy: "sympy==1.13.3"
          - os: ubuntu-latest
            python: "3.12"
            sympy: "sympy>=1.13.3,<2"
          - os: ubuntu-latest
            python: "3.13"
            sympy: "sympy>=1.13.3,<2"
          - os: windows-latest
            python: "3.12"
            sympy: "sympy>=1.13.3,<2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install Hypermath from the committed dependency pin
        run: python -u scripts/bootstrap_foundation.py
      - run: python -m pip install -e ".[dev,scientific,verification]" "${{ matrix.sympy }}"
      - run: python -m pip check
      - run: python -m pytest tests -vv -s --durations=10 --timeout=60
      - run: python examples/scientific_interop.py
      - run: python examples/typed_truth.py
      - run: python -m ruff check src tests examples scripts
      - run: python -m build
      - name: Check packaged dependency pin identity
        run: >-
          python -u scripts/check_packaged_pin.py
          --lock verification/hypermath.json --dist dist
      - run: python -m twine check dist/*
      - name: Build the pinned foundation wheel for an isolated installation
        run: python -m pip wheel --no-deps .dependencies/hypermath --wheel-dir build/foundation-wheels
      - name: Exercise the installed Ordinatics wheel outside the checkout
        run: >-
          python -u .dependencies/hypermath/scripts/check_installed_wheel.py
          --package ordinatics --wheel-dir dist --foundation-wheel-dir build/foundation-wheels
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: foundation-distribution-${{ matrix.os }}-${{ matrix.python }}
          path: build/foundation-wheels/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

  paper:
    name: paper source and reading copy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Refresh the manuscript package index
        run: sudo apt-get update
      - name: Install the bounded manuscript toolchain
        run: >-
          sudo apt-get install -y --no-install-recommends
          lmodern poppler-utils texlive-fonts-recommended texlive-latex-base
          texlive-latex-extra
      - name: Install the pinned Markdown converter
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/pandoc.tar.gz"
          printf '%s  %s\n' '72948bf5784f560d5ad1876709daca27e0667f262da727bb33f77b58e52df2f5' "$RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.10.1/bin" >> "$GITHUB_PATH"
      - name: Compile the manuscript and render every page
        run: python -u scripts/build_paper.py --render
      - name: Require the generated Markdown reading copy to be current
        run: git diff --exit-code -- paper/ordinal_arithmetic.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paper-build
          path: |
            paper/ordinal_arithmetic.pdf
            paper/ordinal_arithmetic.md
            paper/render/page-*.png
          if-no-files-found: error

  foundation-artifacts:
    name: foundation wheel consistency
    needs: software
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: foundation-distribution-ubuntu-latest-3.12
          path: build/linux-foundation
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: foundation-distribution-windows-latest-3.12
          path: build/windows-foundation
      - name: Compare independently built foundation payloads
        run: >-
          python scripts/check_index_dependency.py --qualified build/linux-foundation
          --published build/windows-foundation

  grounding-integrity:
    name: grounding integrity (audit and replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -u scripts/bootstrap_foundation.py
      - run: python -m pip install ".[verification]"
      - run: python -u .dependencies/hypermath/scripts/setup_lean.py
      - name: Recompute the exact pinned foundation and replay its evidence
        run: >-
          python -u scripts/check_grounding.py --output build/grounding-integrity
          --timeout 60
      - name: Retain grounding-integrity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: grounding-integrity-evidence
          path: build/grounding-integrity/
          if-no-files-found: error
          retention-days: 90

  foundation:
    name: foundation and completeness gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -u scripts/bootstrap_foundation.py
      - run: python -m pip install ".[verification]"
      - run: python -u .dependencies/hypermath/scripts/setup_lean.py
      - name: Recompute the foundation and require the arithmetic bridge
        run: >-
          python -u scripts/check_grounding.py --require-self-derivation
          --require-complete --timeout 60
      - name: Retain unresolved claims and replay evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: grounding-evidence
          path: build/verification/
          if-no-files-found: error
          retention-days: 90
