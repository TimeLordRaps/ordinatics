name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,scientific]"
      - run: python -m pytest -vv -s --durations=10 --timeout=60
      - run: python examples/scientific_interop.py
      - run: python examples/typed_truth.py
      - run: python -m ruff check src tests examples scripts
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
