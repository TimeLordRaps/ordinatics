[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ordinatics"
version = "0.1.0"
description = "Exact ordinal arithmetic, symbolic specialization, and bounded typed satisfaction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tyler Roost"}]
keywords = ["ordinal", "arithmetic", "sympy", "symbolic-mathematics", "logic", "satisfaction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = ["sympy>=1.13.3,<2"]

[project.optional-dependencies]
scientific = ["numpy>=1.26", "scipy>=1.11"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.11", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/TimeLordRaps/ordinatics"
Documentation = "https://github.com/TimeLordRaps/ordinatics/tree/main/docs"
Repository = "https://github.com/TimeLordRaps/ordinatics"
Issues = "https://github.com/TimeLordRaps/ordinatics/issues"
Paper = "https://github.com/TimeLordRaps/ordinatics/blob/main/paper/ordinal_arithmetic.pdf"

[tool.hatch.build.targets.wheel]
packages = ["src/ordinatics"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "paper/ordinal_arithmetic.tex", "paper/ordinal_arithmetic.md", "scripts/build_paper.py", "CITATION.cff", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv -s --durations=10 --timeout=60"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
