name: publish to PyPI

# Manual release dispatch for PyPI Trusted Publishing.
# Canonical releases run automatically on tagged commits via .github/workflows/release.yml.
on:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test,scientific,release]"
      - run: python -m pytest -q
      - run: python scripts/check_presentation.py
      - name: Build and verify release artifacts
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/release_artifacts.py build --ref HEAD --release "$VERSION" --output-dir dist
          python scripts/release_artifacts.py verify "dist/ordinatics-$VERSION.manifest.json"
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/check_release_boundary.py dist/*.zip dist/*.whl dist/*.tar.gz
      - run: python scripts/check_installed_wheel.py --wheel-dir dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true
